<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>Join Our Newsletter | devChallenges.io</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main
      class="h-screen flex flex-col items-center justify-center bg-[#F9FAFB] gap-7 lg:gap-14"
    >
      <header class="flex flex-col gap-6 lg:gap-7 items-center">
        <img src="./resources/logo.svg" alt="logo" />

        <h1 class="text-black poppins-semibold text-3xl lg:text-5xl text-center">
          Join our newsletter
        </h1>

        <p class="text-[#6C727F] poppins-regular text-base w-[70%] lg:text-xl text-center md:w-[75%] lg:w-[70%] xl:w-[55%]">
          Keep up with our latest collections, exclusive deals, and special
          offers! We introduce a new collection every week, so stay tuned to
          snag the hottest items just for you.
        </p>
      </header>
      <div class="bg-white shadow-xl md:max-w-2xl lg:max-w-xl max-w-xl w-[90%] lg:w-full p-6 rounded-xl flex flex-col gap-7">
        <input type="email" name="email" id="email" class="border-2 border-[#E5E7EB] bg-[#F9FAFB] text-[#000000] text-base rounded-xl p-4 text-center poppins-medium" placeholder="Enter your email address"/>
        <button class="p-4 rounded-xl poppins-semibold text-base text-white bg-[#284BCE] hover:bg-[#284BCE]/90 cursor-pointer">Subscribe now</button>
        <p class="text-sm poppins-regular text-center text-[#394150]">Your email is 100% confidential and won’t send you any spam.</p>
      </div>
    </main>

  </body>
</html>
